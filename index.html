<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#3d281e">
  <meta name="description" content="Cartelera de historias organizada en tres temporadas.">
  <title>Cartelera de historias · Biblioteca</title>
  <style>
    :root { color-scheme: light; --ink:#33241d; --paper:#f4ead4; --wine:#713b35; --gold:#a77b3f; }
    * { box-sizing:border-box; }
    body { margin:0; padding:28px 16px 40px; color:var(--ink); background:radial-gradient(ellipse at top,#f7efdf 0,#e8dcc4 70%,#d7c5a5 100%); font-family:Georgia,"Times New Roman",serif; }
    .page { max-width:1060px; margin:auto; }
    .hero { position:relative; overflow:hidden; padding:42px 28px 36px; text-align:center; color:#f8efd9; background:#3d281e; border:1px solid #9e7948; border-radius:18px 18px 8px 8px; box-shadow:0 12px 30px #35231633; }
    .hero:before,.hero:after { content:"✦"; position:absolute; top:18px; color:#d2b276; font-size:22px; }
    .hero:before { left:22px; }.hero:after { right:22px; }
    .eyebrow,.season,.section-label { letter-spacing:.16em; text-transform:uppercase; }
    .eyebrow { margin:0 0 12px; color:#d8bd84; font:700 12px/1.4 Arial,sans-serif; }
    h1 { margin:0; font-size:clamp(2rem,6vw,3.5rem); font-weight:normal; }
    .intro { margin:14px auto 0; color:#e8d9bd; font-size:1.05rem; line-height:1.5; }
    .ornament { margin-top:18px; color:#d8bd84; letter-spacing:.5em; }
    main { padding:34px 4px 10px; }
    .section-label { margin:0 0 8px; color:var(--wine); font:700 11px/1.4 Arial,sans-serif; text-align:center; }
    h2.section-title { margin:0 0 24px; text-align:center; font-size:clamp(1.5rem,4vw,2.2rem); font-weight:normal; }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; }
    .card { display:flex; flex-direction:column; justify-content:center; min-height:180px; padding:24px; text-align:center; text-decoration:none; color:var(--ink); background:linear-gradient(145deg,#fbf4e4 0%,var(--paper) 72%,#efe1c4 100%); border:1px solid #b99c6d; border-radius:8px 8px 18px 8px; box-shadow:0 8px 20px #3a28151c; transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease; }
    .card:hover,.card:focus-visible { transform:translateY(-3px); border-color:var(--gold); box-shadow:0 12px 24px #3a28152b; outline:3px solid #c6a56d; outline-offset:3px; }
    .season { margin:0 0 14px; color:var(--wine); font:700 12px/1.4 Arial,sans-serif; }
    .story-title { margin:0; font-size:clamp(1.15rem,2.4vw,1.75rem); line-height:1.2; font-weight:normal; }
    .card:nth-child(3):last-child { grid-column:1 / -1; width:calc(50% - 9px); justify-self:center; }
    footer { margin-top:28px; padding:18px 12px 0; color:#6e5a49; border-top:1px solid #b99c6d; text-align:center; font-size:.9rem; }
    @media (max-width:540px) { body { padding:16px 10px 28px; } .hero { padding:36px 18px 28px; } .grid { gap:10px; } .card { min-height:150px; padding:16px 12px; } .card:nth-child(3):last-child { width:calc(50% - 5px); } .season { letter-spacing:.1em; font-size:10px; } }
  </style>
</head>
<body>
  <div class="page">
    <header class="hero">
      <p class="eyebrow">Biblioteca · archivo de aventuras</p>
      <h1>Cartelera de historias</h1>
      <p class="intro">Misión Imposible · tres temporadas</p>
      <div class="ornament" aria-hidden="true">✦ ✧ ✦</div>
    </header>
    <main>
      <p class="section-label">Elegí una temporada</p>
      <h2 class="section-title">Historias</h2>
      <section class="grid" aria-label="Historias organizadas por temporada">
        <a class="card" href="https://fabsito-tech.github.io/el-codigo-escolar/" target="_blank" rel="noopener noreferrer" aria-label="Abrir Temporada 1: El pergamino de los 33">
          <p class="season">Temporada 1</p>
          <h2 class="story-title">El pergamino de los 33</h2>
        </a>
        <a class="card" href="https://fabsito-tech.github.io/mision-imposible-el-alumno-perdido/" target="_blank" rel="noopener noreferrer" aria-label="Abrir Temporada 2: El alumno perdido">
          <p class="season">Temporada 2</p>
          <h2 class="story-title">El alumno perdido</h2>
        </a>
        <a class="card" href="https://fabsito-tech.github.io/el-team-mafia-historia/" target="_blank" rel="noopener noreferrer" aria-label="Abrir Temporada 3: El Team Mafia">
          <p class="season">Temporada 3</p>
          <h2 class="story-title">El Team Mafia</h2>
        </a>
      </section>
    </main>
    <footer>Una biblioteca de historias para recorrer temporada por temporada.</footer>
  </div>
</body>
</html>
